name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  workflow_call:
    inputs:
      scan_id:
        type: string
        default: ''
  schedule:
    - cron: '3 4 * * 3'

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('push-{0}', github.sha) || github.ref }}-${{ inputs.scan_id || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Protect scan diagnostics
        shell: bash
        run: |
          if [[ "${RUNNER_DEBUG:-}" == 1 ]]; then
            printf '%s\n' 'Disable Actions step debug logging before scanning; checkout debug output can disclose commit contents.' >&2
            exit 1
          fi

      - name: Check out the complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history with the verified Gitleaks CLI
        shell: bash
        run: |
          fail() { printf '%s\n' "$1" >&2; exit 1; }
          umask 077
          temp=$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXXXX")
          trap 'rm -rf -- "$temp"' EXIT
          cd "$temp" || fail 'Could not enter the scan directory.'
          curl --fail --silent --show-error --location --max-time 60 --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          [[ $(./gitleaks version) == 8.30.1 ]] || fail 'Could not verify Gitleaks 8.30.1.'

          # Use the pinned rules, not suppression files from the checked-out revision.
          printf '[extend]\nuseDefault = true\n' > scanner.toml
          git_dir="$GITHUB_WORKSPACE/.git"
          [[ $(git -C "$git_dir" rev-parse --is-shallow-repository) == false ]] || fail 'The full Git checkout is unavailable.'
          log_opts='--full-history --diff-filter=uxdb --no-ext-diff --no-textconv --ignore-submodules=all -m'
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base=$(jq -er '.pull_request.base.sha' "$GITHUB_EVENT_PATH")
              head=$(jq -er '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
              for revision in "$base" "$head"; do
                if [[ ! "$revision" =~ ^[0-9a-fA-F]{40}$ ]] || ! git -C "$git_dir" cat-file -e "$revision^{commit}"; then
                  fail 'A pull request revision is invalid or missing from the full checkout.'
                fi
              done
              log_opts+=" $base..$head"
              scope='Pull request commits and merge diffs'
              ;;
            push|schedule|workflow_dispatch|workflow_call)
              log_opts+=' --all'
              scope='All fetched history and merge diffs'
              ;;
            *) fail 'Unsupported workflow event.' ;;
          esac

          # Gitleaks can report success even when its Git history subprocess fails.
          GITLEAKS_REAL_GIT=$(command -v git)
          export GITLEAKS_REAL_GIT GITLEAKS_GIT_STATUS="$temp/git-status"
          cat > git <<'BASH'
          #!/bin/bash
          if [[ ${3:-} != log ]]; then
            exec "$GITLEAKS_REAL_GIT" "$@"
          fi
          status=0
          "$GITLEAKS_REAL_GIT" "$@" || status=$?
          printf '%s\n' "$status" > "$GITLEAKS_GIT_STATUS" || exit 1
          exit "$status"
          BASH
          chmod 700 git

          # Keep diagnostics private: even redacted scanner output can contain commit messages.
          status=0
          PATH="$temp:$PATH" timeout --kill-after=5s 930s ./gitleaks git "$git_dir" \
            --config "$temp/scanner.toml" --gitleaks-ignore-path "$temp" \
            --ignore-gitleaks-allow --redact=100 --no-banner --no-color --log-level=error \
            --exit-code=2 --report-format=json --report-path findings.json --log-opts="$log_opts" \
            > scan.stdout 2> scan.stderr || status=$?
          [[ "$status" == 0 || "$status" == 2 ]] || fail "Gitleaks failed (exit $status)."
          [[ ! -s scan.stdout && ! -s scan.stderr ]] || fail 'Gitleaks reported errors; no clean result was recorded.'
          [[ -f git-status && $(<git-status) == 0 ]] || fail 'Git did not confirm a complete history scan.'
          count=$(jq -er 'if type == "array" and all(.[]; type == "object") then length else error("Invalid report") end' findings.json 2>/dev/null) ||
            fail 'Gitleaks did not produce a valid report.'
          [[ ( "$status" == 0 && "$count" == 0 ) || ( "$status" == 2 && "$count" != 0 ) ]] ||
            fail 'Gitleaks exit status and report disagree.'

          {
            printf '## Gitleaks\n\nScanner: **8.30.1**\n\nScope: **%s**\n\n' "$scope"
            if (( count == 0 )); then
              printf '%s\n' 'No matching secrets were found by the pinned built-in rules.'
            else
              printf '**%s potential secrets detected.** Rotate any real exposed credentials.\n\n' "$count"
              printf '| Rule | File | Line | Commit |\n| --- | --- | --- | --- |\n'
              jq -r 'def cell: tostring | @html | gsub("\\|"; "&#124;") | gsub("[\\r\\n]"; " ") | "<code>\(.)</code>";
                .[:200][] | [.RuleID, .File, .StartLine, .Commit] | "| " + (map(cell) | join(" | ")) + " |"' findings.json
              if (( count > 200 )); then
                printf '\nShowing 200 locations. Repeat the same scan locally for the full report.\n'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if (( count > 0 )); then
            fail 'Review the redacted locations in the job summary.'
          fi
          printf '%s\n' 'The scan completed; no matching secrets were found.'
