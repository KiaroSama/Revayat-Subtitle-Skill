name: Export public audit source
on:
  push:
    branches: [audit/render-snapshots-20261004]
    paths: ['.github/workflows/audit-source-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: da7bd571bfa0776f8e9e1a70ca01f41f62c04516
          persist-credentials: false
      - name: Export only the audited public tracked tree
        shell: bash
        run: |
          set -euo pipefail
          log() { printf '[%s UTC] [%s] %s\n' "$(date -u '+%Y-%m-%d %H:%M:%S')" "$1" "$2"; }
          trap 'log ERROR "Public source export failed"' ERR
          test "$(git rev-parse HEAD)" = 'da7bd571bfa0776f8e9e1a70ca01f41f62c04516'
          log INFO 'Archiving the exact public tracked source tree for practical audit tests'
          git archive --format=tar -o public-audit-source.tar HEAD
          log DEBUG 'No git credentials, working secrets or ignored files are included'
          log WARNING 'Owner-local Rules and hooks are not part of the public export'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-audit-source-da7bd571
          path: public-audit-source.tar
          if-no-files-found: error
          retention-days: 1
