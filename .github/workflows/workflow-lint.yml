name: Workflow checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Lint workflow syntax and security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow syntax and shell commands
        shell: bash
        run: |
          lint_dir=$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXXXX")
          trap 'rm -rf -- "$lint_dir"' EXIT
          archive="$lint_dir/actionlint.tar.gz"
          curl --fail --location --max-time 60 --output "$archive" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$lint_dir" actionlint
          "$lint_dir/actionlint" -color
      - name: Reject unsafe workflow patterns
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: 1.33.1
          inputs: .github/workflows .github/dependabot.yml
          persona: pedantic
          strict-collection: true
          advanced-security: false
