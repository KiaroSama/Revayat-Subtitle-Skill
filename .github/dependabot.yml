version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      codeql:
        patterns:
          - 'github/codeql-action/*'
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /skills/revayat-subtitle
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: cargo
    directory: /rust/markup-rs
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  - package-ecosystem: cargo
    directory: /rust/persian-lint-rs
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  - package-ecosystem: cargo
    directory: /rust/subcore-rs
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  - package-ecosystem: cargo
    directory: /rust/subsync-rs
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
