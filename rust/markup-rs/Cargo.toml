[package]
name = "markup-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false
description = "Rust port of `skills/revayat-subtitle/scripts/markup.py`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py39"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
fancy-regex = "0.20"
regex = "1"
unicode-bidi = "0.3.18"
html-escape = "0.3.1"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
