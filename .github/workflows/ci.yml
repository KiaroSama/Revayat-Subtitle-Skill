name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:
    inputs:
      validation_id:
        description: Isolate validation for independent caller runs
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.validation_id || '' }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    permissions:
      contents: read
    uses: ./.github/workflows/workflow-lint.yml

  rust:
    name: Rust (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            test: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            test: true
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            test: true
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            test: true
    env:
      RUST_TARGET: ${{ matrix.target }}
      REVAYAT_REQUIRE_FFMPEG: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned native Rust toolchain
        shell: bash
        run: |
          rustup set default-host "$RUST_TARGET"
          rustup toolchain install "1.100.0-$RUST_TARGET" --profile minimal --component rustfmt --component clippy
          rustup default "1.100.0-$RUST_TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Build both release binaries
        shell: bash
        run: cargo build --workspace --release --locked --target "$RUST_TARGET" --bin revayat-subtitle --bin subsync
      - name: Check Rust formatting
        if: matrix.runner == 'ubuntu-24.04'
        run: cargo fmt --all -- --check
      - name: Run Clippy
        if: matrix.test
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install Linux FFmpeg and fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install verified Windows FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The ARM64 lane runs native Rust binaries with this verified x64 FFmpeg under Windows emulation.
          $destination = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          New-Item -ItemType Directory -Path $destination | Out-Null
          $archive = Join-Path $destination 'ffmpeg.zip'
          Invoke-WebRequest -TimeoutSec 120 -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba') { throw 'FFmpeg checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $binary = Get-ChildItem -LiteralPath $destination -Recurse -File -Filter ffmpeg.exe | Select-Object -First 1
          if (!$binary) { throw 'FFmpeg executable missing' }
          $binary.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test Rust workspace with FFmpeg and libass
        if: matrix.test
        shell: bash
        run: |
          filters=$(ffmpeg -hide_banner -filters)
          grep -Eq '[[:space:]]ass[[:space:]]' <<< "$filters"
          cargo test --workspace --locked --no-fail-fast

  repo-hygiene:
    name: Repo hygiene & code metrics
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check tracked files, toolchain, and plugin versions
        shell: bash
        run: |
          tracked_scripts=$(git ls-files '*.py' '*.ps1' '*.sh')
          if [[ -n "$tracked_scripts" ]]; then
            printf 'Unexpected tracked scripts:\n%s\n' "$tracked_scripts" >&2
            exit 1
          fi
          git ls-files -z -- '*.rs' | (
            failed=0
            while IFS= read -r -d '' path; do
              lines=$(awk 'END { print NR }' < "$path")
              if (( lines > 800 )); then
                printf '%s: %s lines exceeds 800\n' "$path" "$lines" >&2
                failed=1
              fi
            done
            exit "$failed"
          )
          awk '
            /^[[:space:]]*\[/ { toolchain = ($0 ~ /^[[:space:]]*\[toolchain\][[:space:]]*$/) }
            toolchain && /^[[:space:]]*channel[[:space:]]*=[[:space:]]*"1\.100\.0"[[:space:]]*(#.*)?$/ { pinned = 1 }
            END { exit !pinned }
          ' rust-toolchain.toml || { printf '%s\n' 'Expected Rust 1.100.0 in rust-toolchain.toml.' >&2; exit 1; }
          for manifest in plugin.json .claude-plugin/plugin.json .codex-plugin/plugin.json .cursor-plugin/plugin.json .antigravity-plugin/plugin.json; do
            jq -e '.version == "3.0.5"' "$manifest" > /dev/null || {
              printf '%s: expected plugin version 3.0.5\n' "$manifest" >&2
              exit 1
            }
          done
      - name: Check whitespace in the validated changes
        shell: bash
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=$(jq -er '.pull_request.base.sha' "$GITHUB_EVENT_PATH") ;;
            merge_group) base=$(jq -er '.merge_group.base_sha' "$GITHUB_EVENT_PATH") ;;
            push) base=$(jq -er '.before' "$GITHUB_EVENT_PATH") ;;
            *) base=$(git rev-parse --verify HEAD^ 2>/dev/null || git hash-object -t tree /dev/null) ;;
          esac
          if [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            base=$(git hash-object -t tree /dev/null)
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          git diff --check "$base" HEAD --

  required:
    name: CI required
    if: always()
    needs: [workflow-lint, rust, repo-hygiene]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 2
    steps:
      - name: Require every validation job to pass
        shell: bash
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$JOB_RESULTS"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$JOB_RESULTS" > /dev/null
