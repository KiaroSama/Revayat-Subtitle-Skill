name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Install libass renderer and fonts
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install verified Windows renderer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Join-Path $PWD '.scratch/ffmpeg'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $archive = Join-Path $destination 'ffmpeg.zip'
          Invoke-WebRequest -TimeoutSec 120 -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba') { throw 'FFmpeg checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $binary = Get-ChildItem -LiteralPath $destination -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $binary) { throw 'FFmpeg executable missing' }
          $binary.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check CLI, formats, installation and rendering
        if: (runner.os == 'Linux' && matrix.python == '3.14') || runner.os == 'Windows'
        run: python -X utf8 tests/check.py --render
      - name: Check CLI, formats and native installation
        if: runner.os == 'macOS' || matrix.python == '3.11'
        run: python -X utf8 tests/check.py
      - name: Retain authored failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-${{ matrix.os }}-${{ matrix.python }}
          path: .scratch/ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7
