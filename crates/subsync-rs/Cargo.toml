[package]
name = "subsync-rs"
version = "3.0.0"
edition = "2024"
rust-version = "1.100.0"

[lib]
name = "subsync_rs"
path = "src/lib.rs"

[[bin]]
name = "subsync"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "11", default-features = false, features = ["std", "job-object", "kill-on-drop"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.32", default-features = false, features = ["process"] }
process-wrap = { version = "11", default-features = false, features = ["std", "process-group"] }
